# Local mirror of the CI checks; CI remains the authority.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21  # keep in lockstep with the ruff version in uv.lock
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
