[project]
name = "edgar-lakehouse"
version = "0.1.0"
description = "End-to-end lakehouse on SEC EDGAR filings and market data"
authors = [{ name = "Lucas Pessoa Rosa" }]
readme = "README.md"
license = "MIT"
# Matches the Databricks serverless runtime.
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
# Missing-docstring rules would demand one on every trivial helper and test.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
